name: reviewdog
on: [pull_request]

permissions:
  contents: read

jobs:
  textlint:
    name: runner / textlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run textlint
        id: run-textlint
        shell: bash
        run: |
          set +e
          pnpm exec textlint -f checkstyle "articles/**" > textlint-checkstyle.xml
          status=$?
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Set up reviewdog filter
        if: steps.run-textlint.outcome == 'success'
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.0

      - name: Filter textlint findings to changed lines
        if: steps.run-textlint.outcome == 'success'
        run: |
          reviewdog \
            -f=checkstyle \
            -name=textlint \
            -reporter=rdjson \
            -filter-mode=added \
            -level=warning \
            -fail-level=none \
            < textlint-checkstyle.xml \
            > textlint-rdjson.json

      - name: Upload textlint report
        if: steps.run-textlint.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: textlint-rdjson
          path: textlint-rdjson.json
          if-no-files-found: error

  review-posting:
    name: runner / textlint review
    needs: textlint
    if: needs.textlint.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This job only posts findings from the artifact; it does not execute PR code.
      pull-requests: write
    steps:
      - name: Download textlint report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: textlint-rdjson
          path: artifacts

      - name: Set up reviewdog
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: v0.21.0

      - name: Post textlint review
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog \
            -f=rdjson \
            -name=textlint \
            -reporter=github-pr-review \
            -filter-mode=nofilter \
            -level=warning \
            -fail-level=none \
            < artifacts/textlint-checkstyle.xml
